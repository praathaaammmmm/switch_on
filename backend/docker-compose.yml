# Local development stack: PostgreSQL + the API. Secrets come from .env (created by ./dev, never committed).
name: switchon

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: switchon
      POSTGRES_USER: switchon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env (run ./dev up)}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U switchon -d switchon"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/switchon
      DATABASE_USER: switchon
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      APP_ENV: ${APP_ENV:-development}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      ADMIN_OWNER_EMAIL: ${ADMIN_OWNER_EMAIL:-}
      ADMIN_OWNER_PASSWORD: ${ADMIN_OWNER_PASSWORD:-}
      PORT: "8080"
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 3s
      timeout: 3s
      retries: 40

volumes:
  pgdata:
